# .github/workflows/main.yml
name: Telegram Bot Deployment

on:
  push:
    branches: [ main ]
    paths:
      - '**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug: Print working directory
        run: pwd

      - name: Debug: List files in repository
        run: ls -R

      - name: Debug: List files in commands directory
        run: ls -l commands

      - name: Clear cache
        run: |
          rm -rf __pycache__
          find . -name "*.pyc" -delete

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stop previous bot (if running)
        run: |
          pkill -f bot.py || true

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          nohup python bot.py &
