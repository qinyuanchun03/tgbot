# .github/workflows/main.yml
name: Telegram Bot Deployment

on:
  push:
    branches: [ main ]  # 当推送到 main 分支时触发
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clear cache
        run: |
          rm -rf __pycache__
          find . -name "*.pyc" -delete

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # 或者你使用的 Python 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 如果你有 requirements.txt 文件

      - name: Stop previous bot (if running)
        run: |
          pkill -f bot.py || true  # 尝试停止之前的机器人进程，忽略错误

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # 从 GitHub Secrets 获取 Token
        run: |
          nohup python bot.py &  # 在后台运行机器人
