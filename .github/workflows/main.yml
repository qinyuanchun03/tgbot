# .github/workflows/main.yml
name: Telegram Bot Server Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stop previous server (if running)
        run: |
          pkill -9 -f "python serve.py" || true
          sleep 5

      - name: Check if server is stopped
        run: |
          if pgrep -f "python serve.py"; then
            echo "Server is still running!"
            exit 1
          else
            echo "Server is stopped."
          fi

      - name: Run Telegram Bot Server
        run: |
          nohup python serve.py &
